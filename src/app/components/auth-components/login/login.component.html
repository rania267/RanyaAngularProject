<body>
<div class="limiter">
  <li class="nav-item">
    <a href class="nav-link" (click)="logout()">LogOut</a>
  </li>
  <div class="container-login100">

    <div class="wrap-login100">
      <h2 class="login100-form-title">Account Login</h2>

      <form *ngIf="!isLoggedIn" (ngSubmit)="onSubmit()" #f="ngForm" class="login100-form" novalidate>
        <div *ngIf="isLoginFailed" class="alert alert-danger" role="alert">
          Login failed: {{ errorMessage }}
        </div>

        <div class="form-group" [ngClass]="{'has-error': f.submitted && f.invalid}">
          <div class="input-wrap">
            <label for="username">Username</label>
            <input type="text" class="input100" name="username"  [(ngModel)]="form.username" required placeholder="Enter your username" />
          </div>

          <div class="input-wrap">
            <label for="password">Password</label>
            <input type="password" class="input100" name="password"   [(ngModel)]="form.password" required minlength="6" placeholder="Enter your password" />
          </div>

          <div class="container-login100-form-btn">
            <button class="login100-form-btn" type="submit">Login</button>
          </div>

          <h4 class="text-center"><a class="txt2" routerLink="/forgot-password"><i class="fas fa-question-circle"></i> Forget Password?</a></h4>
          <h4 class="text-center"><a class="txt2" routerLink="/register"><i class="fas fa-user-plus"></i> Register</a></h4>
        </div>
      </form>

      <div *ngIf="isLoggedIn" class="alert alert-success">
        Logged in as {{ roles }}.
      </div>
    </div>

   
  </div>
</div>
</body>
