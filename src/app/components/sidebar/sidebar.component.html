<div class="logo" style="background-color: rgb(53, 74, 106);">
    <a href="" class="simple-text logo-mini">
        <div class="logo-img">
            <img src="./assets/img/Logowev.png" />
        </div>
    </a>
    <a href="" class="simple-text logo-normal">
        Wevioo
    </a>
</div>
<div class="sidebar-wrapper">
    <ul class="nav">
        <ng-container *ngFor="let menuItem of menuItems">
            <li routerLinkActive="active" class="{{ menuItem.class }} nav-item">
                <a *ngIf="menuItem.children" (click)="toggleSubMenu(menuItem)">
                    <i class="now-ui-icons {{ menuItem.icon }}"></i>
                    <p>{{ menuItem.title }}</p>
                </a>
                <a *ngIf="!menuItem.children" [routerLink]="[menuItem.path]">
                    <i class="now-ui-icons {{ menuItem.icon }}"></i>
                    <p>{{ menuItem.title }}</p>
                </a>
                <ul *ngIf="menuItem.showSubMenu" class="sub-menu">
                    <li *ngFor="let child of menuItem.children" [routerLinkActive]="['active']" class="nav-item">
                        <a [routerLink]="[child.path]">
                            <i class="now-ui-icons {{ child.icon }}"></i>
                            <p>{{ child.title }}</p>
                        </a>
                    </li>
                </ul>
            </li>
        </ng-container>
    </ul>
</div>
