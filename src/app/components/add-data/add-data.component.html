<form [formGroup]="databaseForm">
    <div class="home-container">
      <h2>Add Database Url</h2>
   
      <div class="example-container">
        <mat-form-field appearance="fill">
          <mat-label>DatabaseName:</mat-label>
          <input matInput formControlName="name">
          <mat-error>test</mat-error>
        </mat-form-field>
      </div>
  
      <div class="example-container">
        <mat-form-field appearance="fill">
          <mat-label>Username:</mat-label>
          <input matInput formControlName="username">
          <mat-error>test</mat-error>
        </mat-form-field>
      </div>
  
      <div class="example-container">
        <mat-form-field appearance="fill">
          <mat-label>Password:</mat-label>
          <input matInput formControlName="password">
          <mat-error>test</mat-error>
        </mat-form-field>
      </div>
  
  
      <div class="example-container">
        <mat-form-field appearance="fill">
          <mat-label>Port:</mat-label>
          <input matInput formControlName="port">
          <mat-error>test</mat-error>
        </mat-form-field>
      </div>
     
      <div class="example-container">
        <mat-form-field appearance="fill">
          <mat-label>URL:</mat-label>
          <input matInput formControlName="url">
          <mat-error>test</mat-error>
        </mat-form-field>
      </div>
      <div class="example-container">
        <mat-form-field appearance="fill">
          <mat-label>Host:</mat-label>
          <input matInput formControlName="host">
          <mat-error>test</mat-error>
        </mat-form-field>
      </div>
      <div class="example-container">
        <mat-form-field appearance="fill">
          <mat-label>System:</mat-label>
          <mat-select formControlName="system">
            <mat-option *ngFor="let dbSystem of databaseSystems" [value]="dbSystem.value">
              {{ dbSystem.label }}
            </mat-option>
          </mat-select>
          <mat-error>test</mat-error>
        </mat-form-field>
      </div>
  
  
    </div>
    <div class="form-group">
        <div class="col-md-9 col-sm-9 offset-md-3">
          <div class="row">
            <button type="button" id="btn1" class="login100-form-btn" (click)="testConnection()">Test Connection</button>
            <button type="submit" id="btn2" (click)="createEvent()"  class="login100-form-btn" routerLink="/databaseList">Add Database</button>
          </div>
        </div>
      </div> 
  </form>
