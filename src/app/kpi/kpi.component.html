<div class="panel-header panel-header-sm">
</div>
<div class="main-content">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title">KPIs List
                    </h4>
                </div>
                <div class="card-body">
         
                    
                    <div class="input-group mb-3 search-input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text" id="basic-addon1">Search</span>
                        </div>
                        <input type="text" class="form-control" placeholder="Type here to search" [(ngModel)]="searchText">
                        <div class="input-group-append">
                            <span class="input-group-text">
                                <i class="fas fa-search"></i>
                            </span>
                        </div>
                    </div>      
                    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

                        <!-- Id KPI Column -->
                        <ng-container matColumnDef="id_kpi">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header
                                sortActionDescription="Sort by ID KPI">
                                ID KPI
                            </th>
                            <td mat-cell *matCellDef="let element"> {{element.id_kpi}} </td>
                        </ng-container>

                        <!-- Name KPI Column -->
                        <ng-container matColumnDef="name_kpi">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by Name KPI">
                                Name KPI
                            </th>
                            <td mat-cell *matCellDef="let element"> {{element.name_kpi}} </td>
                        </ng-container>

                        <!-- Subject Area Column -->
                        <ng-container matColumnDef="subject_area">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header
                                sortActionDescription="Sort by Subject Area">
                                Subject Area
                            </th>
                            <td mat-cell *matCellDef="let element"> {{element.subject_area}} </td>
                        </ng-container>

                        <!-- Type Column -->
                        <ng-container matColumnDef="type">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header
                                sortActionDescription="Sort by Type">
                                Type
                            </th>
                            <td mat-cell *matCellDef="let element"> {{element.type}} </td>
                        </ng-container>

                        <!-- Seuil Column -->
                        <ng-container matColumnDef="seuil">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header
                                sortActionDescription="Sort by Seuil">
                                Seuil
                            </th>
                            <td mat-cell *matCellDef="let element"> {{element.seuil}} </td>
                        </ng-container>

                        <!-- Seuil Gap Column -->
                        <ng-container matColumnDef="seuil_gap">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header
                                sortActionDescription="Sort by Seuil Gap">
                                Seuil Gap
                            </th>
                            <td mat-cell *matCellDef="let element"> {{element.seuil_gap}} </td>
                        </ng-container>

                        <!-- Seuil Data Quality Column -->
                        <ng-container matColumnDef="seuil_dataQuality">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header
                                sortActionDescription="Sort by Seuil Data Quality">
                                Seuil Data Quality
                            </th>
                            <td mat-cell *matCellDef="let element"> {{element.seuil_dataQuality}} </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
