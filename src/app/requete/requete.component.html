<div class="panel-header panel-header-sm">
  <!-- Your existing panel-header content goes here -->
</div>

<div class="main-content">
  <div class="row">
      <div class="col-md-12">
          <div class="card">
            <div class="card-header">
                <h4 class="card-title">Query</h4>
            </div>
            <h3 style="padding-left: 30px;color:rgb(70, 104, 154);">Queries List</h3>

              <div class="card-body">

                  <!-- Search Input -->
                  <div class="input-group mb-3 search-input-group">
                      <div class="input-group-prepend">
                          <span class="input-group-text" id="basic-addon1">Search</span>
                      </div>
                      <input type="text" class="form-control" placeholder="Type here to search" [(ngModel)]="searchText">
                      <div class="input-group-append">
                          <span class="input-group-text">
                              <i class="fas fa-search"></i>
                          </span>
                      </div>
                  </div>

                  <!-- Requete Table -->
                  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

                      <!-- Id Column -->
                      <ng-container matColumnDef="id">
                          <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by ID">
                              ID
                          </th>
                          <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                      </ng-container>

                      <!-- Code Requete Column -->
                      <ng-container matColumnDef="code_requete">
                          <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by Code Requete">
                              Code Requete
                          </th>
                          <td mat-cell *matCellDef="let element"> {{element.code_requete}} </td>
                      </ng-container>

                      <!-- Date Column -->
                      <ng-container matColumnDef="date">
                          <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by Date">
                              Date
                          </th>
                          <td mat-cell *matCellDef="let element"> {{element.date}} </td>
                      </ng-container>

                      <!-- Val KPI Column -->
                      <ng-container matColumnDef="val_kpi">
                          <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by Val KPI">
                              Val KPI
                          </th>
                          <td mat-cell *matCellDef="let element"> {{element.val_kpi}} </td>
                      </ng-container>

                      <!-- Val KPI Alias Column -->
                      <ng-container matColumnDef="val_kpi_alias">
                          <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by Val KPI Alias">
                              Val KPI Alias
                          </th>
                          <td mat-cell *matCellDef="let element"> {{element.val_kpi_alias}} </td>
                      </ng-container>

                      <!-- Other Columns... -->

                      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                  </table>
              </div>
          </div>
      </div>
  </div>
</div>
