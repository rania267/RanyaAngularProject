<div class="panel-header panel-header-sm">
</div>
<div class="main-content">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title">Manage Scripts</h4>
                </div>
                <div class="card-body">
<div class="container body">
  

    <!-- page content -->
    <div class="right_col" role="main">
        <div class="">
          

            <div class="clearfix"></div>

            <div class="row">
                <div class="col-md-12 col-sm-12 ">
                    <div class="x_panel">
                        <div class="x_title">
                            <h2><small></small></h2>
                            <ul class="nav navbar-right panel_toolbox">
                                <!-- Angular Event Binding Example -->
                                <!-- <li><a class="collapse-link" (click)="togglePanel()"><i class="fa fa-chevron-up"></i></a></li> -->
                            </ul>
                            <div class="clearfix"></div>
                        </div>
                        <div class="x_content">
                            <br/>
                            <!-- Angular Form Example -->
                            <form id="demo-form2" [formGroup]="myForm" (ngSubmit)="onSubmit()">
                                <p style="color:red;">{{message}}</p>
                                
                                <!-- Angular RouterLink Example -->
                                <a routerLink="/deleteAll">Delete Old Data</a>
                                
                                <h3>{{msg}}</h3>

                                <div class="form-group row d-flex align-items-center">
                                    <label class="control-label col-md-2 col-sm-2 label-align">Database 1 <span class="required"> =  </span></label>
                                    <div class="col-md-3 col-sm-3">
                                        <div>
                                            <select formControlName="selectSQLDatabase" class="browser-default custom-select">
                                                <option value="">-- Select Database --</option>
                                                <option [value]="">SqlServer</option>
                                                <option [value]="">Postgres</option>
                                                <option [value]="">Oracle</option>
                                                <option [value]="">MySql</option>
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <label class="col-form-label col-md-2 col-sm-2 label-align">Database 2 <span class="required"> = </span></label>
                                    <div class="col-md-3 col-sm-3 mr-2">
                                        <div>
                                            <select formControlName="selectSQLDatabase" class="browser-default custom-select">
                                                <option value="">-- Select Database --</option>
                                                <option [value]="">SqlServer</option>
                                                <option [value]="">Postgres</option>
                                                <option [value]="">Oracle</option>
                                                <option [value]="">MySql</option>
                                            </select>
                                        </div>
                                    </div>
                                
                                    <div class="col-md-2 col-sm-2">
                                        <button id="kpiSubmit" class="btn btn-primary" type="submit">Load Kpi List</button>
                                    </div>                                </div>
                                
                      

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-group row text-center">
            <div class="col-md-12">
                <button id="load12" class="btn" type="button" name="load12" style="margin-right: 10px; background-color: rgb(98, 165, 247); color: white;">Launch Test</button>
                <button type="button" class="btn" data-toggle="modal" data-target="#scheduleModal" style="background-color: rgb(98, 165, 247); color: white;">Plan Task</button>
            </div>
        </div>
        
    </div>
              
  
</div>

        </div>
